{{ define "main" }}
  <div class="container">
    <h2>{{ .Title }}</h2>
    {{ if .Pages }}
      <ul>
      {{ range .Pages }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
      </ul>
    {{ else }}
      <p>No items found for this taxonomy.</p>
    {{ end }}
  </div>
{{ end }}
